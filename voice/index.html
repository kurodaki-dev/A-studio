<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- 'wasm-unsafe-eval' lets ONNX Runtime run DiffSinger models (WebAssembly).
         connect-src allows the VOICEVOX engine address chosen by the user. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' http: https: blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="theme-color" content="#14121c" />
    <title>A Voice Studio</title>
  </head>
  <body>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
