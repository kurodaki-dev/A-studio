name: Bug report
description: Something does not work as expected in A Studio.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Everything you write here is public.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Menu, Settings. Filled in automatically when you use the Report a bug button.
      placeholder: 1.0.12
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the piano roll
        2. ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or project file
      description: Optional. You can attach a screenshot or an exported .astudio file.
