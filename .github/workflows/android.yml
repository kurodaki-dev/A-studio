name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Construire l'interface
        run: npm run build

      - name: Copier l'interface dans le projet Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk A-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: A-Studio-apk
          path: A-Studio.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" A-Studio.apk --title "A Studio $GITHUB_REF_NAME" --notes "APK Android de A Studio $GITHUB_REF_NAME."
