name: APK Android

# Each push on main publishes a new release (v1.0.<n>) with the signed APK.
# The app checks the latest release and offers the download.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build number shown in the app and compared with the latest release.
      APP_BUILD: ${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Tests of the MCP bridge
        working-directory: mcp-server
        run: |
          npm ci
          npm test

      - name: Construire l'interface
        run: npm run build

      - name: Copier l'interface dans le projet Android
        run: npx cap sync android

      - name: APK de test (pull request)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../A-Studio.apk

      - name: Préparer la clé de signature
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE est absent. Sans clé fixe, les mises à jour ne pourraient pas s'installer par dessus l'ancienne version. Voir le README, section Publication."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/astudio.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/astudio.jks" >> "$GITHUB_ENV"

      - name: APK signé
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../A-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: A-Studio-apk
          path: A-Studio.apk

      - name: Publier la release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" A-Studio.apk \
            --target "$GITHUB_SHA" \
            --title "A Studio $APP_VERSION" \
            --generate-notes \
            --latest
